{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} · Footbase</title>
    <link rel="stylesheet" href="{% static 'portal/css/portal.css' %}">
</head>

<body>
    <div class="shell">
        <aside class="sidebar">
            <a class="brand" href="{% url 'home' %}">
                <span class="brand-mark">F</span>
                <span>
                    soka
                    <small>FOOTBALL PORTAL</small>
                </span>
            </a>

            <nav>
                {% for label, url_name in nav_items %}
                    <a class="nav-link {% if active == url_name %}is-active{% endif %}" href="{% url url_name %}">
                        <span class="nav-dot"></span>
                        {{ label }}
                    </a>
                {% endfor %}
            </nav>

            <div class="sidebar-bottom">
                <span class="club-badge">AZ</span>
                <span>
                    <b>Azam FC</b>
                    <small>2026 / 27 season</small>
                </span>
            </div>
        </aside>

        <main>
            <header class="topbar">
                <div>
                    <p class="eyebrow">AZAM FOOTBALL CLUB</p>
                    <h1>{{ page_title }}</h1>
                </div>

                <div class="top-actions">
                    <button class="icon-button" aria-label="Notifications">◌</button>
                    <span class="avatar">AS</span>
                </div>
            </header>

            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
